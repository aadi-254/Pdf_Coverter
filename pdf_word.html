<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF to Word Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
  <style>
    body{font-family:Arial,sans-serif;padding:24px;background:#f7fafc;}
    .card{max-width:800px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    input[type="file"]{margin:12px 0;}
    button{background:#007bff;color:#fff;border:none;padding:10px 16px;border-radius:4px;cursor:pointer;}
    button:hover{background:#0056b3;}
    button:disabled{background:#ccc;cursor:not-allowed;}
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html">← Home</a>
    <h2>PDF → Word</h2>
    <input type="file" id="pdfInput" accept=".pdf">
    <button onclick="convertToWord()">Convert to Word</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function convertToWord() {
      const fileInput = document.getElementById('pdfInput');
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a PDF file.');
        return;
      }

      const btn = document.querySelector('button');
      btn.textContent = 'Processing...';
      btn.disabled = true;

      const reader = new FileReader();
      reader.onload = (e) => {
        const arrayBuffer = e.target.result;
        pdfjsLib.getDocument({ data: arrayBuffer }).promise
          .then((pdf) => {
            let text = '';
            const promises = [];
            for (let i = 1; i <= pdf.numPages; i++) {
              promises.push(pdf.getPage(i).then(page => page.getTextContent()).then(content => {
                content.items.forEach(item => text += item.str + ' ');
                text += '\n';
              }));
            }
            return Promise.all(promises).then(() => text);
          })
          .then((text) => {
            const { Document, Packer, Paragraph, TextRun } = docx;
            const doc = new Document({
              sections: [{
                properties: {},
                children: text.split('\n').map(line => new Paragraph({ children: [new TextRun(line)] }))
              }]
            });
            Packer.toBlob(doc).then(blob => {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'converted.pdf.docx';
              a.click();
              URL.revokeObjectURL(url);
              btn.textContent = 'Convert to Word';
              btn.disabled = false;
            });
          })
          .catch((err) => {
            console.error(err);
            alert('Error converting file.');
            btn.textContent = 'Convert to Word';
            btn.disabled = false;
          });
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
