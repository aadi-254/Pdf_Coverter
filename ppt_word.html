<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PPT to Word Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
  <style>
    body{font-family:Arial,sans-serif;padding:24px;background:#f7fafc;}
    .card{max-width:800px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    input[type="file"]{margin:12px 0;}
    button{background:#007bff;color:#fff;border:none;padding:10px 16px;border-radius:4px;cursor:pointer;}
    button:hover{background:#0056b3;}
    button:disabled{background:#ccc;cursor:not-allowed;}
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html">← Home</a>
    <h2>PPT → Word</h2>
    <input type="file" id="pptInput" accept=".pptx">
    <button onclick="convertToWord()">Convert to Word</button>
  </div>

  <script>
    function convertToWord() {
      const fileInput = document.getElementById('pptInput');
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a .pptx file.');
        return;
      }

      const btn = document.querySelector('button');
      btn.textContent = 'Processing...';
      btn.disabled = true;

      const reader = new FileReader();
      reader.onload = (e) => {
        const arrayBuffer = e.target.result;
        JSZip.loadAsync(arrayBuffer).then(zip => {
          const textPromises = [];
          zip.forEach((relativePath, file) => {
            if (relativePath.endsWith('.xml') && relativePath.includes('slides/slide')) {
              textPromises.push(file.async('text').then(xml => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const texts = doc.querySelectorAll('a:t');
                return Array.from(texts).map(t => t.textContent).join(' ');
              }));
            }
          });
          return Promise.all(textPromises);
        }).then(texts => {
          const { Document, Packer, Paragraph, TextRun } = docx;
          const doc = new Document({
            sections: [{
              properties: {},
              children: texts.map(text => new Paragraph({ children: [new TextRun(text)] }))
            }]
          });
          Packer.toBlob(doc).then(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'converted.pptx.docx';
            a.click();
            URL.revokeObjectURL(url);
            btn.textContent = 'Convert to Word';
            btn.disabled = false;
          });
        }).catch(err => {
          console.error(err);
          alert('Error converting file.');
          btn.textContent = 'Convert to Word';
          btn.disabled = false;
        });
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
