<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Word to PDF Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- ✅ Add html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7fafc;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 32px 24px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 18px;
    }
    input[type="file"] {
      margin: 18px 0;
      padding: 8px;
    }
    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 12px;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      color: #d9534f;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Word to PDF Converter</h1>
    <input type="file" id="wordInput" accept=".docx">
    <br>
    <button id="convertBtn">Convert to PDF</button>
    <div class="status" id="status"></div>
    <a href="index.html" style="display:block;margin-top:24px;">← Back to Home</a>
  </div>
  <script>
    document.getElementById('convertBtn').addEventListener('click', function() {
      const fileInput = document.getElementById('wordInput');
      const statusDiv = document.getElementById('status');
      const file = fileInput.files[0];
      if (!file) {
        statusDiv.textContent = 'Please select a .docx file.';
        return;
      }
      if (!file.name.endsWith('.docx')) {
        statusDiv.textContent = 'Invalid file type. Please select a .docx file.';
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        statusDiv.textContent = 'File size exceeds 10MB limit.';
        return;
      }
      this.disabled = true;
      statusDiv.textContent = 'Converting...';
      const reader = new FileReader();
      reader.onload = function(e) {
        const arrayBuffer = e.target.result;
        mammoth.convertToHtml({ arrayBuffer })
          .then(function(result) {
            const html = result.value;
            // Create a hidden div to render HTML
            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            tempDiv.style.top = '-9999px';
            tempDiv.style.width = '400px';
            tempDiv.innerHTML = html;
            document.body.appendChild(tempDiv);
            // Generate PDF
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
            pdf.html(tempDiv, {
              callback: function(doc) {
                doc.save(file.name.replace(/\.docx$/, '.pdf'));
                statusDiv.textContent = 'Conversion complete!';
                document.getElementById('convertBtn').disabled = false;
                document.body.removeChild(tempDiv);
              },
              x: 20,
              y: 20,
              width: 400
            });
          })
          .catch(function(err) {
            statusDiv.textContent = 'Error: ' + (err.message || 'Failed to convert file.');
            document.getElementById('convertBtn').disabled = false;
          });
      };
      reader.onerror = function() {
        statusDiv.textContent = 'Error reading file.';
        document.getElementById('convertBtn').disabled = false;
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
